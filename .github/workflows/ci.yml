# Garde-fou des PR (dont les MàJ Renovate) : build de production + smoke tests Playwright.
# Un échec laisse la PR ouverte et déclenche une notification GitHub.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build & smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm run test:e2e

      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
